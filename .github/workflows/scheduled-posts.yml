name: Publish scheduled posts

# Jekyll skips posts dated in the future, and GitHub Pages only rebuilds on
# push. Once a day, request a Pages build if a post became due since the last
# successful build. Comparing against that build (not just today) means a
# missed run or a failed build is caught up by the next run.
#
# Posts are scheduled by the date in their filename. Don't set a later date or
# a time in front matter: the post would be skipped by the build this workflow
# triggers and then no longer count as due.
on:
  schedule:
    - cron: "5 0 * * *" # 00:05 UTC, already the next day in Europe/Dublin
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Dublin # the site's timezone in _config.yml
    steps:
      - name: Request a Pages build if a post became due since the last build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date +%F)
          # Newest successful build; with none (or no build history), treat every past post as due.
          built_at=$(gh api "repos/$REPO/pages/builds" \
            --jq '[.[] | select(.status == "built")][0].created_at // empty' || true)
          last_build=""
          # gh prints the error body on failure, so only accept a timestamp.
          case "$built_at" in
            [0-9][0-9][0-9][0-9]-*T*Z) last_build=$(date -d "$built_at" +%F) ;;
          esac
          due=$(gh api "repos/$REPO/contents/_posts" --jq '.[].name[:10]' |
            awk -v from="$last_build" -v to="$today" '$0 > from && $0 <= to')
          if [ -n "$due" ]; then
            echo "Posts due since last build (${last_build:-none}): $due"
            gh api -X POST "repos/$REPO/pages/builds"
          else
            echo "No posts due since last build on $last_build"
          fi
