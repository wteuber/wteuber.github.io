{% if site.giscus.repository and site.giscus.hostname %}

<script src="https://{{ site.giscus.hostname }}/client.js"
        data-repo="{{ site.giscus.repository }}"
        data-repo-id="{{ site.giscus.repository-id }}"
        data-category="{{ site.giscus.category }}"
        data-category-id="{{ site.giscus.category-id }}"
        data-mapping="{{ site.giscus.mapping }}"
        data-reactions-enabled="{{ site.giscus.reactions-enabled }}"
        data-emit-metadata="{{ site.giscus.emit-metadata }}"
        data-theme="{{ site.giscus.theme }}"
        crossorigin="anonymous"
        async>
</script>

<script>
  // Keep giscus in sync with the night mode button (assets/js/skin-switch.js),
  // which toggles .page-dark-mode on <body>.
  (function () {
    var origin = "https://{{ site.giscus.hostname }}";
    var listening = false;

    function syncTheme() {
      if (!listening) { return; }
      var frame = document.querySelector("iframe.giscus-frame");
      if (!frame) { return; }
      var theme = document.body.classList.contains("page-dark-mode") ? "dark" : "light";
      frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, origin);
    }

    // The iframe loads asynchronously; its first message means it is ready for setConfig.
    window.addEventListener("message", function (event) {
      if (event.origin !== origin || !event.data || !event.data.giscus) { return; }
      listening = true;
      syncTheme();
    });

    // Watch the class rather than the click, so this works regardless of which
    // click handler runs first, and also covers the toggle skin-switch.js fires
    // on page load when dark mode is remembered in localStorage.
    new MutationObserver(syncTheme)
      .observe(document.body, { attributes: true, attributeFilter: ["class"] });
  })();
</script>

{% endif %}
