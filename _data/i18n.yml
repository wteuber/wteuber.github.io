# Interface text per language. The keys of this file are the site's languages
# (see `languages` in _config.yml); `prefix` is where that language's pages live.

en:
  name: "English"
  prefix: ""
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  date_format: "[month] [day], [year]"
  by: "By"
  posted_on: "Posted on"
  last_updated: "Last updated"
  read_more: "Read More"
  tags: "Tags"
  newer_posts: "Newer Posts"
  older_posts: "Older Posts"
  previous_post: "Previous Post"
  next_post: "Next Post"
  search: "Search"
  exit_search: "Exit search"
  night_mode: "Toggle Night Mode"
  minute_read: "minute read"
  share: "Share"
  sketch: "sketch"
  game: "game"
  slider_label: "Slide between the paper sketch and the game"
  slider_hint: "Drag the handle to compare the sketch and the game"
  in_language: {en: "in English", de: "in German"}
  # Widgets embedded in posts. {name} placeholders are filled in by the widget.
  samegame:
    round: "Round"
    click_score: "Click Score"
    total_score: "Total Score"
    game_over_one: "Game over! You scored {n} point. "
    game_over_many: "Game over! You scored {n} points. "
    try_again: "Try again!"
  tax_meter:
    title: "Tax meter"
    intro: "A tax-inclusive bill, paid in equal installments. Each installment is split two ways: the everyday accounting-software approach of rounding its tax on its own, and PennyWise&rsquo;s running floor. Watch the totals reconcile, or not."
    bill_total: "Bill total"
    tax_rate: "Tax rate"
    installments: "Installments"
    currency_before: "$"
    currency_after: ""
    thousands: ","
    decimal: "."
    plug: "Force the books to balance by dropping the leftover onto the last installment. That is what most accounting software does, usually without saying so."
    standard: "Standard rounding"
    installment: "Installment"
    net: "net"
    tax: "tax"
    delta_tax: "&Delta; tax"
    strip_title: "Standard method&rsquo;s running tax error: above the line it has collected too much, below, too little"
    strip_label: "Cumulative rounding error, in cents, after each installment"
    note: "&ldquo;Standard rounding&rdquo; here is each installment&rsquo;s tax taken on its own as <code>round(installment &times; rate &divide; (1 + rate))</code>, then netted: exactly what a receipt line shows. Across a plan the pieces rarely add back to the invoice. PennyWise reads one floored running total instead, so the installments always sum to the bill and no receipt is ever off by more than a cent."
    noscript: "This widget needs JavaScript. The worked example just above walks through the same calculation by hand."
    enter_values: "Enter a positive bill total and tax rate."
    plugged_title: "Its own amount implies {own}; adjusted by {delta} to make the books balance."
    matches_invoice: "Matches the invoice."
    off_invoice: "{delta} against the {tax} on the invoice."
    delta_title: "PennyWise tax total minus Standard tax total."
    exact: "For these numbers the round-each-installment method happens to land exactly on the invoice. Nudge the total, the rate, or the installment count and it drifts."
    drift: "The round-each-installment column comes to <b class=\"pw-drift\">{sum}</b> of tax, {drift} against the {tax} the invoice actually contains. PennyWise distributes exactly {tax}, <b class=\"pw-recon\">every time</b>."
    plug_zero: "Here the leftover is zero. The rounded installments already summed to the invoice, and PennyWise reaches the same place without a correction step."
    plug_moved: "The books balance, but only because installment #{n}&rsquo;s tax was quietly moved by <b class=\"pw-drift\">{delta}</b> to soak up the rounding. PennyWise spreads that same difference so <b class=\"pw-recon\">no installment is ever off by more than a cent</b>."
    bar_title: "after installment {n}: {err}"
  tax_staircase:
    title: "The tax staircase is a Bresenham line"
    intro: "A 36-atom bill, paid in equal installments. Laid out atom by atom along the bottom, the tax owed rises as a straight line to the right. The floored running total lights one whole pixel per atom, kept as close to that line as the grid allows: <b style=\"color:var(--pwb-net)\">blue</b> where the atom is net, <b style=\"color:var(--pwb-tax)\">orange</b> where it is tax. The orange pixels land by the same rule a screen uses to draw a slanted line. (The vertical axis is stretched so a shallow real-world rate stays legible.)"
    installments: "Installments"
    tax_rate: "Tax rate"
    percent: "{v}%"
    decimal: "."
    round: "Round each atom to the nearest tax level instead of flooring, and watch the staircase climb above the true line."
    net_atom: "net atom"
    tax_atom: "tax atom"
    true_line: "true proportional line"
    plot_label: "Bresenham staircase of the floored running tax total across a bill's atoms, cut into installments"
    noscript: "This widget needs JavaScript. The worked example earlier in the post walks the same staircase by hand."
    axis_one: "36 atoms of the bill &nbsp;&middot;&nbsp; {n} installment, each shown as net + tax &rarr;"
    axis_many: "36 atoms of the bill &nbsp;&middot;&nbsp; {n} installments, each shown as net + tax &rarr;"
    zero: "At <b>{rate}</b> the 36-atom bill does not contain a whole tax atom. The floored running total never leaves zero, so every installment is charged nothing. Nudge the rate up and the first tax atom appears."
    rounded: "Rounding lets the red staircase climb <b>{lead}</b> of an atom above the true line, around installment {n}. For that stretch the running tax is ahead of what has been paid, a receipt promising tax the customer has not reached yet. The books still balance at the end, but the middle of the story is wrong. Flooring (dashed) never crosses above the line."
    contains_one: "At <b>{rate}</b> the 36-atom bill contains <b>1</b> tax atom. Bresenham&rsquo;s rule puts that one atom in the last installment; the floored line does not reach a whole tax atom until the bill is fully paid. The staircase stays on or below the true line the whole way and only meets it at the last atom, so no installment is charged tax before it is paid."
    contains_many: "At <b>{rate}</b> the 36-atom bill contains <b>{t}</b> tax atoms. Bresenham&rsquo;s line spreads them across the installments as <b>{list}</b>, never differing by more than one, summing to exactly {sum}. The staircase stays on or below the true line the whole way and only meets it at the last atom, so no installment is charged tax before it is paid."

de:
  name: "Deutsch"
  prefix: "/de"
  months: [Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember]
  date_format: "[day]. [month] [year]"
  by: "Von"
  posted_on: "Veröffentlicht am"
  last_updated: "Zuletzt aktualisiert am"
  read_more: "Weiterlesen"
  tags: "Tags"
  newer_posts: "Neuere Beiträge"
  older_posts: "Ältere Beiträge"
  previous_post: "Vorheriger Beitrag"
  next_post: "Nächster Beitrag"
  search: "Suche"
  exit_search: "Suche schließen"
  night_mode: "Nachtmodus umschalten"
  minute_read: "Min. Lesezeit"
  share: "Teilen"
  sketch: "Skizze"
  game: "Spiel"
  slider_label: "Zwischen der Papierskizze und dem Spiel hin- und herschieben"
  slider_hint: "Zieh am Regler, um Skizze und Spiel zu vergleichen"
  in_language: {en: "auf Englisch", de: "auf Deutsch"}
  feed_description: "Diese Website ist der virtuelle Beweis dafür, dass ich großartig bin"
  samegame:
    round: "Runde"
    click_score: "Punkte für den Klick"
    total_score: "Punkte gesamt"
    game_over_one: "Spiel vorbei! Du hast {n} Punkt geholt. "
    game_over_many: "Spiel vorbei! Du hast {n} Punkte geholt. "
    try_again: "Noch mal!"
  tax_meter:
    title: "Steuerrechner"
    intro: "Eine Rechnung inklusive Steuer, bezahlt in gleich großen Raten. Jede Rate wird auf zwei Arten aufgeteilt: so, wie es Buchhaltungssoftware üblicherweise macht, mit eigener Rundung pro Rate, und mit der laufenden, abgerundeten Summe von PennyWise. Schau, ob die Summen aufgehen."
    bill_total: "Rechnungsbetrag"
    tax_rate: "Steuersatz"
    installments: "Raten"
    currency_before: ""
    currency_after: " €"
    thousands: "."
    decimal: ","
    plug: "Die Bücher zum Ausgleich zwingen, indem der Rest auf die letzte Rate geschoben wird. Genau das macht die meiste Buchhaltungssoftware, meistens ohne es zu sagen."
    standard: "Normal gerundet"
    installment: "Rate"
    net: "netto"
    tax: "Steuer"
    delta_tax: "&Delta; Steuer"
    strip_title: "Laufender Steuerfehler der normalen Methode: über der Linie zu viel kassiert, darunter zu wenig"
    strip_label: "Aufsummierter Rundungsfehler in Cent nach jeder Rate"
    note: "„Normal gerundet“ heißt hier: Die Steuer jeder Rate wird für sich als <code>round(Rate &times; Satz &divide; (1 + Satz))</code> berechnet und dann abgezogen, genau wie es auf einem Beleg steht. Über einen ganzen Ratenplan ergeben die Teile selten wieder die Rechnung. PennyWise liest stattdessen eine einzige abgerundete laufende Summe ab. Die Raten ergeben deshalb immer genau die Rechnung, und kein Beleg liegt je mehr als einen Cent daneben."
    noscript: "Dieses Widget braucht JavaScript. Das Rechenbeispiel direkt darüber geht dieselbe Rechnung von Hand durch."
    enter_values: "Gib einen positiven Rechnungsbetrag und Steuersatz ein."
    plugged_title: "Für sich allein ergibt die Rate {own}; um {delta} angepasst, damit die Bücher aufgehen."
    matches_invoice: "Passt zur Rechnung."
    off_invoice: "{delta} gegenüber den {tax} auf der Rechnung."
    delta_title: "Steuersumme von PennyWise minus Steuersumme bei normaler Rundung."
    exact: "Bei diesen Zahlen landet die Methode mit eigener Rundung pro Rate zufällig genau auf der Rechnung. Ändere den Betrag, den Steuersatz oder die Zahl der Raten ein bisschen, und schon weicht sie ab."
    drift: "Mit eigener Rundung pro Rate kommen <b class=\"pw-drift\">{sum}</b> Steuer zusammen, {drift} gegenüber den {tax}, die wirklich in der Rechnung stecken. PennyWise verteilt genau {tax}, <b class=\"pw-recon\">jedes Mal</b>."
    plug_zero: "Hier bleibt kein Rest. Die gerundeten Raten ergeben schon die Rechnung, und PennyWise kommt ohne Korrekturschritt zum selben Ergebnis."
    plug_moved: "Die Bücher gehen auf, aber nur, weil die Steuer von Rate {n} still und leise um <b class=\"pw-drift\">{delta}</b> verschoben wurde, um die Rundung aufzufangen. PennyWise verteilt denselben Unterschied so, dass <b class=\"pw-recon\">keine Rate je mehr als einen Cent daneben liegt</b>."
    bar_title: "nach Rate {n}: {err}"
  tax_staircase:
    title: "Die Steuertreppe ist eine Bresenham-Linie"
    intro: "Eine Rechnung über 36 Atome, bezahlt in gleich großen Raten. Legt man sie unten Atom für Atom aus, steigt die geschuldete Steuer als gerade Linie nach rechts an. Die abgerundete laufende Summe färbt pro Atom genau ein Pixel, so nah an dieser Linie, wie das Raster es zulässt: <b style=\"color:var(--pwb-net)\">blau</b>, wenn das Atom netto ist, <b style=\"color:var(--pwb-tax)\">orange</b>, wenn es Steuer ist. Die orangen Pixel landen nach derselben Regel, mit der ein Bildschirm eine schräge Linie zeichnet. (Die senkrechte Achse ist gestreckt, damit auch ein flacher, realistischer Steuersatz lesbar bleibt.)"
    installments: "Raten"
    tax_rate: "Steuersatz"
    percent: "{v} %"
    decimal: ","
    round: "Jedes Atom auf die nächste Steuerstufe runden statt abrunden, und zusehen, wie die Treppe über die wahre Linie steigt."
    net_atom: "Netto-Atom"
    tax_atom: "Steuer-Atom"
    true_line: "wahre proportionale Linie"
    plot_label: "Bresenham-Treppe der abgerundeten laufenden Steuersumme über die Atome einer Rechnung, aufgeteilt in Raten"
    noscript: "Dieses Widget braucht JavaScript. Das Rechenbeispiel weiter oben geht dieselbe Treppe von Hand durch."
    axis_one: "36 Atome der Rechnung &nbsp;&middot;&nbsp; {n} Rate, jeweils als netto + Steuer &rarr;"
    axis_many: "36 Atome der Rechnung &nbsp;&middot;&nbsp; {n} Raten, jeweils als netto + Steuer &rarr;"
    zero: "Bei <b>{rate}</b> enthält die Rechnung über 36 Atome kein ganzes Steuer-Atom. Die abgerundete laufende Summe bleibt bei null, also wird keiner Rate Steuer berechnet. Dreh den Steuersatz etwas hoch, dann taucht das erste Steuer-Atom auf."
    rounded: "Durch das Runden steigt die rote Treppe um <b>{lead}</b> Atom über die wahre Linie, etwa bei Rate {n}. Auf diesem Stück liegt die laufende Steuer vor dem, was bezahlt wurde: Der Beleg weist Steuer aus, bei der die Zahlung noch gar nicht angekommen ist. Am Ende gehen die Bücher trotzdem auf, aber in der Mitte stimmt die Geschichte nicht. Abrunden (gestrichelt) kommt nie über die Linie."
    contains_one: "Bei <b>{rate}</b> enthält die Rechnung über 36 Atome <b>1</b> Steuer-Atom. Nach der Bresenham-Regel landet dieses eine Atom in der letzten Rate: Die abgerundete Linie erreicht erst ein ganzes Steuer-Atom, wenn die Rechnung vollständig bezahlt ist. Die Treppe bleibt die ganze Zeit auf oder unter der wahren Linie und trifft sie erst beim letzten Atom. Keiner Rate wird also Steuer berechnet, bevor sie bezahlt ist."
    contains_many: "Bei <b>{rate}</b> enthält die Rechnung über 36 Atome <b>{t}</b> Steuer-Atome. Die Bresenham-Linie verteilt sie als <b>{list}</b> auf die Raten, nie mit mehr als eins Unterschied, in Summe genau {sum}. Die Treppe bleibt die ganze Zeit auf oder unter der wahren Linie und trifft sie erst beim letzten Atom. Keiner Rate wird also Steuer berechnet, bevor sie bezahlt ist."
