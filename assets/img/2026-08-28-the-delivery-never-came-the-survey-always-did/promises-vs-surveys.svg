<text x="46" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1A1D1A">One purchase. 149 days. Two systems that never spoke.</text>
<text x="46" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#6E756E">Every date the retailer put in writing and let pass, against every email asking me to rate the experience.</text>
<text x="46" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#A31E14">PROMISED, THEN MISSED</text>
<text x="46" y="159" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6E756E">7 delivery dates</text>
<text x="46" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#D9531A">ASKED ME TO RATE IT</text>
<text x="46" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6E756E">6 surveys and review requests</text>
