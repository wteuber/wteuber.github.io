<text x="322.9" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1D1A" text-anchor="start">Day 24 &#8212; half the order arrives,</text>
<text x="322.9" y="249" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6E756E" text-anchor="start">unannounced, 19 days late</text>
<text x="375.2" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1D1A" text-anchor="start">Day 32 &#8212; the missing half is</text>
<text x="375.2" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6E756E" text-anchor="start">cancelled and refunded</text>
<text x="983.7" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1D1A" text-anchor="end">Day 130 &#8212; half again, unannounced</text>
<text x="1150.0" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#33684A" text-anchor="end">complete</text>
<text x="987.5" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#D9531A" text-anchor="end">Day 126: &#8220;Our records suggest you recently</text>
